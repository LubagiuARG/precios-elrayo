name: Actualizar lista de precios

on:
  schedule:
    # Hora UTC: 10, 13 y 16 h UTC = 7, 10 y 13 h de Argentina.
    # Minutos "raros" a propósito: GitHub demora o saltea los cron en punto (hora pico).
    # La corrida de :53 es de respaldo; si la lista no cambió, no hace commit.
    - cron: "23,53 10,13,16 * * *"
  workflow_dispatch:   # botón "Run workflow" para actualizar a mano

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pdfplumber==0.11.10
      - name: Descargar el PDF del Drive y regenerar la app
        run: python scripts/actualizar.py
      - name: Guardar cambios (solo si la lista cambió)
        run: |
          git config user.name "actualizador"
          git config user.email "actions@github.com"
          git add index.html data/productos.json
          git diff --cached --quiet && echo "Sin cambios" || (git commit -m "Lista de precios $(date +%d/%m/%Y)" && git push)